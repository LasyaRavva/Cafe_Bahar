      h1 { margin: 20px 0; font: 500 clamp(42px, 8vw, 72px)/1.05 Georgia, serif; }
      h1 em { color: #dfb16c; }
      a { display: inline-flex; min-height: 44px; align-items: center; padding: 0 18px; background: #c78e43; color: #191813; text-decoration: none; }
